name: frontend-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build --tag salon-web:ci .
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Check out the pinned backend for the demo stack
        run: |
          git clone --filter=blob:none https://github.com/harshpgoti/salon-backend.git ../backend
          git -C ../backend checkout 23f5556d0e84c62b5a6ec64f05ea1fca5efda00e
      - name: Start the demo stack
        run: docker compose -f ci/docker-compose.demo.yml up --build -d
      - name: Wait for backend and frontend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "demo stack did not become healthy" >&2
          docker compose -f ci/docker-compose.demo.yml logs --no-color | tail -n 200
          exit 1
      - run: npm ci
      - name: Install Playwright and axe-core for QA only
        run: |
          npm install --no-save @playwright/test@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Run browser journeys and axe scans
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
      - name: Tear down the demo stack
        if: always()
        run: docker compose -f ci/docker-compose.demo.yml down -v
